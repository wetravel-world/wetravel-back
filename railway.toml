[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python manage.py migrate --noinput && gunicorn wetravel_back.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
healthcheckPath = "/api/cities/"
healthcheckTimeout = 360
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
